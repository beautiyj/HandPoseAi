{% extends "common/base.html" %}
{% load static %} {% block content %}
<style>
    .container { display: flex; flex-wrap: wrap; height: calc(100vh - 80px); width: 100%; }
    .camera-section { flex: 1; min-width: 300px; background: #f4f4f4; display: flex; align-items: center; justify-content: center; position: relative; }
    .model-section { flex: 1; min-width: 300px; background: #e0d5b0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* 추가된 스타일: 비디오와 캔버스를 겹치기 위함 */
    .canvas-wrapper { position: relative; width: 90%; aspect-ratio: 1/1; background: #000; border-radius: 8px; overflow: hidden; }
    .input_video { display: none; } /* 원본 비디오는 숨김 */
    .output_canvas { width: 100%; height: 100%; object-fit: cover; } /* 캔버스를 꽉 채움 */

    @media (max-width: 768px) {
        .camera-section { order: 2; flex: 0.8; }
        .model-section { order: 1; flex: 1.2; }
    }
</style>

<main class="container">
    <section class="camera-section">
        <div class="canvas-wrapper">
            <video class="input_video"></video>
            <canvas class="output_canvas"></canvas>
        </div>
    </section>

    <section class="model-section">
        <h2 style="font-size: 3rem; margin-bottom: 20px; font-weight: 900;">3D MODEL</h2>
        <div id="three-container" style="width: 80%; height: 60%; border: 2px solid #000; background: rgba(255,255,255,0.2);">
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script src="{% static 'tracker/js/hand_ai.js' %}"></script>

{% endblock %}
